<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // ==========================================
      // EDIT ONLY THIS ONE LINE BELOW:
      const TARGET_URL = "https://drive.google.com/drive/u/1/folders/1PLmtdzHhy8wX8jhgaL77RDWXV_pyP737";
      // ==========================================

      // Queries GitHub's live API (0-second delay after commit, never cached)
      fetch("https://api.github.com/repos/NANDHA0804/v2/contents/index.html?t=" + Date.now(), {
        headers: { "Accept": "application/vnd.github.v3.raw" },
        cache: "no-store"
      })
        .then(r => {
          if (!r.ok) throw new Error("API limit or error");
          return r.text();
        })
        .then(html => {
          const match = html.match(/const\s+TARGET_URL\s*=\s*["']([^"']+)["']/);
          window.location.replace(match ? match[1] : TARGET_URL);
        })
        .catch(() => {
          window.location.replace(TARGET_URL);
        });
    </script>
  </head>
  <body style="background-color: #000000;"></body>
</html>
